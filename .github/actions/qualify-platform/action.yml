name: Qualify one lmvideo release platform
description: Exercise the sealed lmvideo candidate without publication credentials
inputs:
  artifact:
    description: Immutable candidate handoff artifact from the trusted broker run
    required: true
  parent_run:
    description: Public broker run that owns the artifact
    required: true
  tag:
    description: Exact private-candidate version tag
    required: true
  asset:
    description: Exact native executable in the candidate
    required: true
  name:
    description: Native platform label
    required: true
  python:
    description: Python executable on this runner
    required: true
  sums_sha256:
    description: Checksum identity verified by the trusted handoff job
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
      with:
        artifact-ids: ${{ inputs.artifact }}
        merge-multiple: true
        run-id: ${{ inputs.parent_run }}
        github-token: ${{ github.token }}
        path: draft-assets
    - name: Verify the exact broker-to-worker candidate bytes
      shell: bash
      env:
        EXPECTED_SUMS_SHA: ${{ inputs.sums_sha256 }}
        PYTHON: ${{ inputs.python }}
      run: "$PYTHON scripts/check-local-candidate.py draft-assets \"$EXPECTED_SUMS_SHA\""
    - name: Install the lmscript compiler in a runner-local prefix
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.460
        compiler="$RUNNER_TEMP/compiler/node_modules/.bin/lmscript"
        if [ "$RUNNER_OS" = Windows ]; then compiler="$compiler.cmd"; fi
        echo "LMSCRIPT_BIN=$compiler" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/compiler/node_modules/.bin" >> "$GITHUB_PATH"
        echo "LMCTL_HOME=$RUNNER_TEMP/lmvideo-qualification-home" >> "$GITHUB_ENV"
        echo "LMSCRIPT_TOOL_CACHE=$RUNNER_TEMP/lmvideo-qualification-cache" >> "$GITHUB_ENV"
    - name: Install the exact draft binary through lmscript PATH resolution
      shell: bash
      env:
        DRAFT_TAG: ${{ inputs.tag }}
        DRAFT_ASSET: ${{ inputs.asset }}
        PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        "$PYTHON" scripts/install-draft-host.py \
          --compiler "$LMSCRIPT_BIN" \
          --tag "$DRAFT_TAG" \
          --asset "$DRAFT_ASSET" \
          --candidate draft-assets
    - name: Export the candidate's embedded schema for host controls
      shell: bash
      run: |
        set -euo pipefail
        "$LMVIDEO_BIN" --lmcode-schema --json > "$RUNNER_TEMP/lmvideo-schema.json"
        echo "LMVIDEO_QUALIFY_SCHEMA=$RUNNER_TEMP/lmvideo-schema.json" >> "$GITHUB_ENV"
        echo "LMVIDEO_QUALIFY_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
    - name: Run lmcode framing, explicit result and dry validation controls
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        "$PYTHON" tests/lmcode-protocol.py "$LMVIDEO_BIN"
        "$PYTHON" tests/svg-dry-validation.py "$LMVIDEO_BIN" "$LMSCRIPT_BIN"
    - name: Run the CPU rigid-body API and refusal gate
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: "$PYTHON tests/physics-api.py \"$LMVIDEO_BIN\""
    - name: Run svg-compact through the candidate and pinned PowerPoint host
      shell: bash
      env:
        LMVIDEO_CANDIDATE_BIN: ${{ runner.temp }}/lmvideo-draft-bin/lmvideo${{ runner.os == 'Windows' && '.exe' || '' }}
        PYTHON: ${{ inputs.python }}
      run: "$PYTHON tests/svg-compact-pptx.py \"$LMSCRIPT_BIN\""
    - name: Run fresh installer, Cycles raster and pinned example compatibility checks
      shell: bash
      env:
        RELEASE_ASSET: ${{ inputs.asset }}
        RELEASE_TAG: ${{ inputs.tag }}
        PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        "$PYTHON" scripts/check-local-release.py \
          --asset "draft-assets/$RELEASE_ASSET" \
          --version "${RELEASE_TAG#v}" \
          --compiler "$LMSCRIPT_BIN" \
          --work "$RUNNER_TEMP/lmvideo-candidate-rehearsal"
    - name: Run every public example against the candidate on this OS
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: "$PYTHON scripts/integration-run.py --report \"$RUNNER_TEMP/integration-${{ inputs.name }}.json\" --summary \"$GITHUB_STEP_SUMMARY\""
    - name: Upload platform evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: lmvideo-qualification-${{ inputs.name }}
        path: |
          ${{ runner.temp }}/integration-${{ inputs.name }}.json
          ${{ runner.temp }}/lmvideo-candidate-rehearsal/local-gate.json
          ${{ runner.temp }}/lmvideo-candidate-rehearsal/compatibility.json
        if-no-files-found: warn
        retention-days: 14
