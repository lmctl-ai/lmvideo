name: Qualify frozen platform artifact
run-name: Qualify artifact ${{ github.event.client_payload.parent_run_id }}.${{ github.event.client_payload.parent_attempt }} ${{ github.event.client_payload.tag }}
on:
  repository_dispatch:
    types: [lmvideo-qualify-frozen]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      failure_control: ${{ steps.gate.outputs.failure_control }}
      sums_sha256: ${{ steps.gate.outputs.sums_sha256 }}
      artifact: ${{ github.event.client_payload.artifact_id }}
      parent_run: ${{ github.event.client_payload.parent_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          artifact-ids: ${{ github.event.client_payload.artifact_id }}
          merge-multiple: true
          run-id: ${{ github.event.client_payload.parent_run_id }}
          github-token: ${{ github.token }}
          path: draft-assets
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-parent-handoff.py
  qualify-macos-arm64:
    needs: candidate
    name: Qualify macos-arm64
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    env:
      LMVIDEO_GATE_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install public example prerequisites and pinned hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LMVIDEO_QUALIFY_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          elif [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg bash
          elif [ "$RUNNER_OS" = Windows ]; then python scripts/install-windows-ffmpeg.py --output-dir "$RUNNER_TEMP/lmvideo-ffmpeg"
          fi
          if [ "$RUNNER_OS" = macOS ]; then BASH5="$(brew --prefix)/bin/bash"; else BASH5=bash; fi
          "$BASH5" scripts/install-hosts.sh
      - uses: ./.github/actions/qualify-platform
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
          parent_run: ${{ needs.candidate.outputs.parent_run }}
          tag: ${{ needs.candidate.outputs.tag }}
          asset: lmvideo-macos-arm64
          name: macos-arm64
          python: python3
          sums_sha256: ${{ needs.candidate.outputs.sums_sha256 }}

  integration:
    needs: [candidate, qualify-macos-arm64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15-intel, name: macos-x64, asset: lmvideo-macos-x64, python: python3 }
          - { os: ubuntu-24.04, name: linux-x64, asset: lmvideo-linux-x64, python: python3 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, asset: lmvideo-linux-arm64, python: python3 }
          - { os: windows-2022, name: windows-x64, asset: lmvideo-windows-x64.exe, python: python }
    name: Qualify ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    env:
      LMVIDEO_GATE_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install public example prerequisites and pinned hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LMVIDEO_QUALIFY_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          elif [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg bash
          elif [ "$RUNNER_OS" = Windows ]; then python scripts/install-windows-ffmpeg.py --output-dir "$RUNNER_TEMP/lmvideo-ffmpeg"
          fi
          if [ "$RUNNER_OS" = macOS ]; then BASH5="$(brew --prefix)/bin/bash"; else BASH5=bash; fi
          "$BASH5" scripts/install-hosts.sh
      - uses: ./.github/actions/qualify-platform
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
          parent_run: ${{ needs.candidate.outputs.parent_run }}
          tag: ${{ needs.candidate.outputs.tag }}
          asset: ${{ matrix.asset }}
          name: ${{ matrix.name }}
          python: ${{ matrix.python }}
          sums_sha256: ${{ needs.candidate.outputs.sums_sha256 }}

  deliberate-failure-test:
    needs: [candidate, qualify-macos-arm64, integration]
    if: ${{ needs.candidate.outputs.failure_control == 'true' && needs.qualify-macos-arm64.result == 'success' && needs.integration.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Run the deliberate public failure-path test
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deliberate public qualification failure

          The five-platform integration matrix passed. This throwaway dispatch
          now fails one public test so the draft retention and no-promotion path
          can be verified.
          SUMMARY
          python3 - <<'PY'
          import unittest
          class FailurePathTest(unittest.TestCase):
              def test_public_draft_is_not_promoted_after_a_test_failure(self):
                  self.fail("deliberate public draft qualification failure")
          unittest.main()
          PY

