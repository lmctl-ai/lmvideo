name: Integration (all OS)

# Installs the released lmvideo (and the hosts the examples pin) on every
# supported OS and runs every public example end to end. Manual only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source Git ref whose examples are run; its declared hosts are installed
        required: true
        default: main
        type: string
      lmvideo_tag:
        description: "lmvideo release tag to test instead of the host pinned by the examples (e.g. v0.1.37); empty = pinned"
        required: false
        default: ''
        type: string
      lmctl_version:
        description: "@lmctl-ai/lmctl npm version (latest if empty); 0.2.460 is the current release compiler"
        required: false
        default: '0.2.460'
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-x64,   os: macos-15-intel }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Checkout the integration tooling from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
          path: _ci
          sparse-checkout: |
            scripts/integration-run.py
            scripts/install-hosts.sh
            scripts/install-windows-ffmpeg.py
            scripts/windows-ffmpeg.lock.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install lmctl
        env:
          LMCTL_VERSION: ${{ inputs.lmctl_version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false "@lmctl-ai/lmctl${LMCTL_VERSION:+@$LMCTL_VERSION}"
          echo "$RUNNER_TEMP/compiler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg bash

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: python _ci/scripts/install-windows-ffmpeg.py --lock _ci/scripts/windows-ffmpeg.lock.json --output-dir "$RUNNER_TEMP/lmvideo-ffmpeg"

      - name: Install the hosts pinned by the examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/install-hosts.sh needs bash >= 4 (globstar, associative arrays); macOS ships 3.2.
          if [ "$RUNNER_OS" = macOS ]; then BASH5="$(brew --prefix)/bin/bash"; else BASH5=bash; fi
          "$BASH5" _ci/scripts/install-hosts.sh

      - name: Override lmvideo with the release under test
        if: ${{ inputs.lmvideo_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LMVIDEO_TAG: ${{ inputs.lmvideo_tag }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p dl && gh release download "$LMVIDEO_TAG" -R lmctl-ai/lmvideo -p "lmvideo-$MATRIX_NAME$ext" -p SHA256SUMS -D dl
          (cd dl && expected="$(awk -v f="lmvideo-$MATRIX_NAME$ext" '$2 == f {print $1}' SHA256SUMS)" && \
            if command -v sha256sum >/dev/null 2>&1; then actual="$(sha256sum "lmvideo-$MATRIX_NAME$ext" | awk '{print $1}')"; else actual="$(shasum -a 256 "lmvideo-$MATRIX_NAME$ext" | awk '{print $1}')"; fi && \
            test -n "$expected" && test "$actual" = "$expected")
          target="$(command -v lmvideo || true)"
          [ -n "$target" ] || target="$(dirname "$(command -v lmscript)")/lmvideo$ext"
          cp "dl/lmvideo-$MATRIX_NAME$ext" "$target"; chmod +x "$target"
          echo "overrode $target"

      - name: Show installed versions
        run: |
          lmscript --version
          lmvideo --version || true

      - name: Run every example
        run: python3 _ci/scripts/integration-run.py --report out/integration-report.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload report and outputs
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ matrix.name }}
          path: |
            out/integration-report.json
            build/**
            images/**
          if-no-files-found: warn
          retention-days: 14
