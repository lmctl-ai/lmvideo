name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

# Build jobs download Skia and run npm; they only need read access. The release job owns the write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Every push to main is a release: MAJOR.MINOR comes from the repo, the patch is the workflow run number.
      # A pushed v* tag releases that exact version. Pull requests and manual runs never release.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "v=$(scripts/stamp-version.sh --base).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64,   static: "1" }
          - { os: ubuntu-24.04-arm, name: linux-arm64, static: "1" }
          - { os: macos-15,         name: macos-arm64, static: "0" }
          - { os: macos-15-intel,   name: macos-x64,   static: "0" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      # Linux executables are fully static; macOS cannot link libSystem statically.
      STATIC: ${{ matrix.static }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: toolchain (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip python3
      - name: toolchain (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.420
          lmscript --version
      - name: cache the Skia pack download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/dl
          key: skia-${{ matrix.name }}-${{ hashFiles('scripts/skia.lock') }}
      - name: fetch Skia (scripts/skia.lock)
        run: scripts/fetch-skia.sh
      - name: build and test
        run: bash test.sh
      - name: build the release executable
        run: |
          make BUILD=build build/lmvideo
          build/lmvideo --version
          if [ "$RUNNER_OS" = Linux ]; then
            out="$(ldd build/lmvideo 2>&1 || true)"
            case "$out" in *"not a dynamic executable"*|*"statically linked"*) ;; *) echo "$out"; echo "::error::lmvideo is not static"; exit 1;; esac
          fi
          ls -l build/lmvideo
      - name: stage release files
        run: |
          mkdir -p dist
          cp build/lmvideo "dist/lmvideo-${{ matrix.name }}"
          scripts/stage-release-notices.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmvideo-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      REL_VERSION: ${{ needs.version.outputs.v }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmvideo-*
          path: dist
          merge-multiple: true
      - name: tag matches lmvideo --version (lmscript @latest compares them)
        run: |
          chmod +x dist/lmvideo-linux-x64
          got="$(dist/lmvideo-linux-x64 --version)"
          test "$got" = "lmvideo $REL_VERSION" || { echo "::error::tag v$REL_VERSION but binary says '$got'"; exit 1; }
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # License files are identical across the platform artifacts and merge into one copy; assets cannot be directories.
          (cd dist && tar -czf lmvideo-third-party-licenses.tar.gz licenses && rm -rf licenses)
          (cd dist && sha256sum lmvideo-* LICENSE THIRD_PARTY_NOTICES.md > SHA256SUMS)
          ls -l dist
          if gh release view "v$REL_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "v$REL_VERSION" --generate-notes dist/*
          fi
