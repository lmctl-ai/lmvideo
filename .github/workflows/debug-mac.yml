name: debug-mac
on: workflow_dispatch
jobs:
  d:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e
          scripts/fetch-skia.sh >/dev/null
          S=third_party/skia
          F="-Icpp -I$S -isystem $S/include -isystem $S/modules/svg/include -isystem $S/modules/skshaper/include"
          t() { echo "== $*"; c++ -std=c++17 "$@" cpp/lmvideo.cpp -o /tmp/x.o 2>&1 | grep -a -c "error:" | sed "s/^/count=/"; }
          t $F -c
          t $F -c -O2
          t $F -c -w
          t $F -c -O2 -w
          t $F -c -O2 -w -Wa,-I$PWD
          t $F -fsyntax-only -O2
          ls -la cpp/lmvideo.cpp; git log -1 --format=%H
          c++ -std=c++17 $F -c -O2 -w cpp/lmvideo.cpp -o /tmp/x.o 2>&1 | head -8 | cut -c1-200
