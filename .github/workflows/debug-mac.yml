name: debug-mac
on: workflow_dispatch
jobs:
  d:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e
          echo '#include <memory>' > /tmp/t.cpp
          c++ -std=c++17 -fsyntax-only /tmp/t.cpp && echo BEFORE-ok
          xcode-select -p; ls /Library/Developer/CommandLineTools 2>&1 | head -2
          brew install ffmpeg >/tmp/brew.log 2>&1; tail -3 /tmp/brew.log
          xcode-select -p
          c++ -std=c++17 -fsyntax-only /tmp/t.cpp && echo AFTER-ok
          c++ -std=c++17 -fsyntax-only -v /tmp/t.cpp 2>&1 | grep -a -A14 "search starts here"
          env | grep -a -i "sdkroot\|cpath\|c_include\|developer"
          which -a c++
